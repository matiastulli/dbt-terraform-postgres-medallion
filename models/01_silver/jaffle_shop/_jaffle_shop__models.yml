version: 2

models:
  - name: stg_customers
    description: Cleaned customers. One row per customer.
    columns:
      - name: customer_id
        description: Primary key of a customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name initial.

  - name: int_customers
    description: Valid customers. One row per customer. No rules yet, so a copy of `stg_customers`; gold and `int_orders` read this model.
    columns:
      - name: customer_id
        description: Primary key of a customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name initial.

  # --- orders -----------------------------------------------------------------

  - name: stg_orders
    description: Raw orders renamed. One row per source row, including invalid ones; `int_orders` filters them.
    columns:
      - name: order_id
        description: Primary key of an order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: The customer who placed the order (renamed from `user_id`). May not exist in `int_customers`.
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Status as it came from the source. May be outside `var('order_statuses')`.

  - name: int_orders
    description: >
      Valid orders only. One row per order. Drops orders with a null id or date,
      a status not in `var('order_statuses')`, or a customer not in `int_customers`.
    columns:
      - name: order_id
        description: Primary key of an order.
        data_tests:
          - unique
          - not_null
          - dropped_rows:
              name: int_orders_dropped_rows
              description: Rows of stg_orders that int_orders dropped, stored in dev_audit.
              arguments:
                upstream: ref('stg_orders')
              config:
                store_failures: true
                warn_if: ">0"
                error_if: ">{{ var('max_dropped_rows') }}"
      - name: customer_id
        description: The customer who placed the order. Always in `int_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('order_statuses') }}"

  # --- payments ---------------------------------------------------------------

  - name: stg_payments
    description: Raw payments renamed, amount in dollars. One row per source row, including invalid ones; `int_payments` filters them.
    columns:
      - name: payment_id
        description: Primary key of a payment.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: The order this payment belongs to. May not be a valid order.
      - name: payment_method
        description: Payment method as it came from the source. May be outside `var('payment_methods')`.
      - name: amount
        description: '{{ doc("amount_dollars") }}'

  - name: int_payments
    description: >
      Valid payments only. One row per payment; an order can have several. Drops
      payments with a null id, a method not in `var('payment_methods')`, a null or
      negative amount, or an order not in `int_orders`.
    columns:
      - name: payment_id
        description: Primary key of a payment.
        data_tests:
          - unique
          - not_null
          - dropped_rows:
              name: int_payments_dropped_rows
              description: Rows of stg_payments that int_payments dropped, stored in dev_audit.
              arguments:
                upstream: ref('stg_payments')
              config:
                store_failures: true
                warn_if: ">0"
                error_if: ">{{ var('max_dropped_rows') }}"
      - name: order_id
        description: The order this payment belongs to. Always a valid order in `int_orders`.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_orders')
                field: order_id
      - name: payment_method
        description: How the payment was made.
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('payment_methods') }}"
      - name: amount
        description: '{{ doc("amount_dollars") }}'
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
