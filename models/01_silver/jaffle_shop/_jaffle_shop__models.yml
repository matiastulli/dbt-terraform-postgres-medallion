version: 2

models:
  - name: stg_customers
    description: Cleaned customers. One row per customer.
    columns:
      - name: customer_id
        description: Primary key of a customer.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name initial.

  # --- orders -----------------------------------------------------------------

  - name: base_orders
    description: >
      Ephemeral (a CTE, not a database object). Raw orders renamed, with a
      `quarantine_reason` per row. Feeds `stg_orders` and `stg_orders_quarantine`.

  - name: stg_orders
    description: Cleaned, valid orders. One row per order. Invalid rows are in `stg_orders_quarantine`.
    columns:
      - name: order_id
        description: Primary key of an order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: The customer who placed the order (renamed from `user_id`).
        data_tests:
          - not_null
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: '{{ doc("order_status") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('order_statuses') }}"

  - name: stg_orders_quarantine
    description: '{{ doc("quarantine_model") }}'
    data_tests:
      - is_empty:
          config:
            severity: warn
    columns:
      - name: order_id
        description: Order id as it came from the source (may be null).
      - name: customer_id
        description: Customer id as it came from the source (renamed from `user_id`).
      - name: order_date
        description: Order date as it came from the source.
      - name: status
        description: Status as it came from the source.
      - name: quarantine_reason
        description: '{{ doc("quarantine_reason") }}'
        data_tests:
          - not_null

  # --- payments ---------------------------------------------------------------

  - name: base_payments
    description: >
      Ephemeral (a CTE, not a database object). Raw payments renamed and converted
      to dollars, with a `quarantine_reason` per row. Feeds `stg_payments` and
      `stg_payments_quarantine`.

  - name: stg_payments
    description: Cleaned, valid payments. One row per payment; an order can have several. Invalid rows are in `stg_payments_quarantine`.
    columns:
      - name: payment_id
        description: Primary key of a payment.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: The order this payment belongs to. Always a valid order in `stg_orders`.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_method
        description: How the payment was made.
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ var('payment_methods') }}"
      - name: amount
        description: '{{ doc("amount_dollars") }}'

  - name: stg_payments_quarantine
    description: '{{ doc("quarantine_model") }}'
    data_tests:
      - is_empty:
          config:
            severity: warn
    columns:
      - name: payment_id
        description: Payment id as it came from the source (may be null).
      - name: order_id
        description: Order id as it came from the source. `unknown_order` if it isn't in `stg_orders`.
      - name: payment_method
        description: Payment method as it came from the source.
      - name: amount
        description: '{{ doc("amount_dollars") }}'
      - name: quarantine_reason
        description: '{{ doc("quarantine_reason") }}'
        data_tests:
          - not_null
