version: 2

models:
  - name: fct_orders
    description: Orders with their payments split by method. One row per order.
    data_tests:
      # Model-level test from the dbt_utils package: every row must satisfy the expression.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "credit_card_amount + coupon_amount + bank_transfer_amount + gift_card_amount = amount"
    columns:
      - name: order_id
        description: Primary key of an order.
        data_tests:
          - unique # guards the grain: one row per order
          - not_null
      - name: customer_id
        description: The customer who placed the order. Joins to `dim_customers`.
        data_tests:
          - not_null
          - relationships: # every order belongs to a known customer
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed. Joins to `dim_dates`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: status
        description: '{{ doc("order_status") }}'
      - name: credit_card_amount
        description: Amount paid by credit card (0 if none).
      - name: coupon_amount
        description: Amount paid by coupon (0 if none).
      - name: bank_transfer_amount
        description: Amount paid by bank transfer (0 if none).
      - name: gift_card_amount
        description: Amount paid by gift card (0 if none).
      - name: amount
        description: Total paid for the order across all methods, in dollars.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: dim_customers
    description: Customers with order history and lifetime value. One row per customer, including customers without orders.
    columns:
      - name: customer_id
        description: Primary key of a customer.
        data_tests:
          - unique # guards the grain: one row per customer
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name initial.
      - name: first_order_date
        description: Date of the customer's first order (null if no orders).
      - name: most_recent_order_date
        description: Date of the customer's latest order (null if no orders).
      - name: number_of_orders
        description: Count of orders placed by the customer.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lifetime_value
        description: Total paid by the customer across all orders, in dollars.

  - name: fct_payments
    description: >
      Payments. One row per payment; an order can have several. Same money as
      `fct_orders`, at a finer grain. Raw payments have no date, so `order_date`
      is the date of the order the payment belongs to.
    columns:
      - name: payment_id
        description: Primary key of a payment.
        data_tests:
          - unique # guards the grain: one row per payment
          - not_null
      - name: order_id
        description: The order this payment belongs to. Joins to `fct_orders`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: customer_id
        description: The customer who placed the order. Joins to `dim_customers`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date of the order this payment belongs to (payments have no date of their own). Joins to `dim_dates`.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: payment_method
        description: How the payment was made.
      - name: amount
        description: '{{ doc("amount_dollars") }}'
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: dim_dates
    description: Calendar. One row per day between `var('dim_dates_start')` and `var('dim_dates_end')` (exclusive), generated with `dbt_utils.date_spine`.
    columns:
      - name: date_day
        description: Primary key. The calendar day.
        data_tests:
          - unique # guards the grain: one row per day
          - not_null
      - name: year
        description: Calendar year.
      - name: quarter
        description: Calendar quarter, 1 to 4.
      - name: month
        description: Month number, 1 to 12.
      - name: month_name
        description: Month name in English, e.g. `January`.
      - name: day_of_month
        description: Day of the month, 1 to 31.
      - name: day_of_week
        description: ISO day of the week, Monday = 1 to Sunday = 7.
      - name: day_name
        description: Day name in English, e.g. `Monday`.
      - name: is_weekend
        description: True on Saturday and Sunday.
