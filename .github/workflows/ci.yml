name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Terraform + dbt on a fresh Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          # Throwaway database: trust auth, like the local Homebrew setup,
          # so Terraform's admin connection needs no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only credentials for the throwaway database above.
      # Local values live in the gitignored .env (see .env.example).
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DBT_PG_PASSWORD: ci_dbt_password
      TF_VAR_pg_admin_user: postgres
      TF_VAR_dbt_user_password: ci_dbt_password
      TF_VAR_analyst_password: ci_analyst_password

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init + validate
        run: |
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform validate

      - name: Terraform apply (database, roles, schemas, grants)
        run: terraform -chdir=terraform apply -input=false -auto-approve

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install -r requirements.txt

      - name: dbt deps + debug
        run: |
          dbt deps
          dbt debug

      - name: dbt seed
        # Silver reads seeds via source(), which doesn't order them first; load explicitly.
        run: dbt seed

      - name: dbt build (models, snapshots, tests)
        run: dbt build

      - name: dbt docs generate
        run: dbt docs generate

      - name: Upload dbt docs
        uses: actions/upload-artifact@v7
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
