name: jaffle_shop
version: "1.0.0"
config-version: 2

profile: jaffle_shop

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layers. Folder names match schema names; dbt prefixes the target
# schema, so these land in dev_00_bronze, dev_01_silver, dev_02_gold.
seeds:
  jaffle_shop:
    +schema: 00_bronze

models:
  jaffle_shop:
    "01_silver":
      +materialized: view
      +schema: 01_silver
    "02_gold":
      +materialized: table
      +schema: 02_gold
