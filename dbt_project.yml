name: jaffle_shop
version: "1.0.0"
config-version: 2

profile: jaffle_shop

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Project-wide variables, read with var('name') in models, tests and macros.
vars:
  # Single source of truth: drives the per-method columns in fct_orders and the
  # accepted_values test on stg_payments.payment_method. Order = column order.
  payment_methods: ["credit_card", "coupon", "bank_transfer", "gift_card"]
  # Valid order statuses: drives the quarantine rule in base_orders and the
  # accepted_values test on stg_orders.status.
  order_statuses: ["placed", "shipped", "completed", "return_pending", "returned"]

# Medallion layers. Folder names match schema names; dbt prefixes the target
# schema, so these land in dev_00_bronze, dev_01_silver, dev_02_gold.
seeds:
  jaffle_shop:
    +schema: 00_bronze

# Snapshots are history of raw data, so they live in the bronze layer too.
snapshots:
  jaffle_shop:
    +schema: 00_bronze

models:
  jaffle_shop:
    # Write YAML descriptions into Postgres as COMMENTs, so DBeaver shows them too.
    +persist_docs:
      relation: true
      columns: true
    # One subfolder per source system (jaffle_shop/, ...). Subfolders inherit
    # the layer's schema and materialization.
    "01_silver":
      +materialized: view
      +schema: 01_silver
      jaffle_shop:
        # base_* models validate raw rows for stg_* and stg_*_quarantine.
        # Ephemeral = compiled as a CTE into those models, never built in Postgres.
        base:
          +materialized: ephemeral
    "02_gold":
      +materialized: table
      +schema: 02_gold
